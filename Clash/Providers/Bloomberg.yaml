  - DOMAIN-SUFFIX,bba.p02.bloomberg.com
  - DOMAIN-SUFFIX,bloomberglp.com
  
  # 关键字匹配（捕捉子域名或相关 CDN）
  - DOMAIN-KEYWORD,bloomberg
  
  # 注意：tvc-invdn-cf-com.investing.com 此域名为investing 图表域名，由于CF验证IP太脏不过已移到此规则集，统一采用干净点的IP
  # 网页F12界面-网络，搜索tvc，查看init.php 响应标头： 其中：server: cloudflare：表示这次响应由 Cloudflare 服务器返回；cf-mitigated: challenge：表示 Cloudflare 对这次请求施加了挑战；cf-ray：是 Cloudflare 为该请求生成的追踪编号。
  - DOMAIN,tvc-invdn-cf-com.investing.com
  
  # investing 代理(streaming 实时数据行情接口)
  - DOMAIN-SUFFIX,investing.com
  - DOMAIN-SUFFIX,forexpros.com

  # investing直连（原来在NAS.yaml直连，被屏蔽后移过来ProxyLite）
  - DOMAIN,cn.investing.com
  - DOMAIN-SUFFIX,primis.tech
  - DOMAIN-SUFFIX,pbxai.com
  - DOMAIN-SUFFIX,hotjar.com
