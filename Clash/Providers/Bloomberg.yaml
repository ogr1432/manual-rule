payload:
  # 官方主站及新闻
  - DOMAIN-SUFFIX,bloomberg.com
  - DOMAIN-SUFFIX,bloomberg.net
  - DOMAIN-SUFFIX,bloomberg.org
  
  # 数据终端与商业服务
